name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-duckdb:
    # Runs the whole pipeline on a tiny scale factor locally in the runner:
    # dbgen -> Parquet -> DuckDB -> dbt build (models + tests) -> reference-query verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline.py run --target duckdb --sf 0.01
      - run: python pipeline.py bench --sf 0.01 --runs 1
      - name: Dashboard smoke test (renders against the freshly built marts)
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, at.exception
          print("dashboard rendered OK")
          EOF